        <!-- CONTEÚDO DA PÁGINA DO SITE -->
        <main>
              <section id="formCadastro">
                      <h1>Cadastre-se</h1>
                      <p>Crie sua conta na EduTech</p>
                      <form>
                            <label for="nomeCadastro">Nome Completo</label>
                            <input id="nomeCadastro" type="text" required>
                            <br>
                            <label for="emailCadastro">E-mail</label>
                            <input id="emailCadastro" type="email" required>
                            <br>
                            <label for="senhaCadastro">Senha</label>
                            <input id="senhaCadastro" type="password" required>
                            <br>
                            <label for="confirmarSenhaCadastro">Confirmar Senha</label>
                            <input id="confirmarSenhaCadastro" type="password" required>
                            <br>
                            <button type="submit">Cadastrar</button>
                      </form>
                      <p>Já possui uma conta? <a href="login.html">Fazer Login</a></p>
              </section>
